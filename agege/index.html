<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1026">
<meta name="format-detection" content="telephone=no">
<title>阿葛人生模擬器</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;color:#fff;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
#hud{position:fixed;left:14px;top:12px;background:rgba(10,14,30,.62);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 14px;min-width:220px;backdrop-filter:blur(4px);font-size:14px;line-height:1.55;pointer-events:none}
#hud .ch{font-size:17px;font-weight:700;color:#ffd166;margin-bottom:4px}
#hud .row b{color:#8ecae6;font-weight:600;display:inline-block;width:54px}
#hud .obj{margin-top:6px;border-top:1px dashed rgba(255,255,255,.2);padding-top:6px;font-size:13px}
#hud .obj div.done{color:#7bd389;text-decoration:line-through;opacity:.75}
#hud .cam{margin-top:6px;font-size:12px;opacity:.8}
#mini{position:fixed;right:14px;top:12px;width:170px;height:170px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(10,14,30,.55);pointer-events:none}
#help{position:fixed;left:14px;bottom:12px;background:rgba(10,14,30,.6);border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.6;pointer-events:none;max-width:330px}
#prompt{position:fixed;left:50%;bottom:30%;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:8px 16px;border-radius:20px;font-size:16px;border:1px solid #ffd166;pointer-events:none}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.8);pointer-events:none}
#lockhint{position:fixed;left:50%;top:58%;transform:translateX(-50%);font-size:13px;opacity:.75;pointer-events:none}
#dlg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(860px,94vw);background:linear-gradient(180deg,rgba(20,24,48,.93),rgba(8,10,24,.96));border:2px solid rgba(255,209,102,.7);border-radius:16px;padding:14px 20px 16px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#dlg .who{display:inline-block;background:#ffd166;color:#222;font-weight:800;padding:2px 12px;border-radius:10px;margin-bottom:8px;font-size:15px}
#dlg .who.think{background:#b8c0ff;font-style:italic}
#dlg .who.nar{background:#e9edc9}
#dlg .txt{font-size:20px;line-height:1.6;min-height:64px}
#dlg .txt.think{font-style:italic;color:#d7dcff}
#dlg .next{position:absolute;right:16px;bottom:8px;font-size:12px;opacity:.6;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.15}}
#choices{margin-top:10px;display:flex;flex-direction:column;gap:8px}
#choices button{font:inherit;font-size:17px;text-align:left;padding:9px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;transition:opacity .2s,background .2s}
#choices button:hover{background:rgba(255,209,102,.25)}
#phone{position:fixed;right:40px;bottom:200px;width:150px;height:260px;border-radius:24px;background:#111;border:4px solid #333;box-shadow:0 0 30px rgba(255,60,60,.4);padding:14px 10px;text-align:center;transform:rotate(-6deg)}
#phone .n{font-size:12px;opacity:.7}
#phone .t{font-size:54px;font-weight:800;font-family:monospace;color:#ff5d5d;margin-top:40px}
#phone .s{font-size:12px;margin-top:20px;color:#bbb}
#clock{position:fixed;right:40px;bottom:210px;width:110px;height:110px}
#vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 40px rgba(180,0,0,0);transition:box-shadow .2s}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 50% 30%,#2b3a67 0%,#0b1026 70%);z-index:20;text-align:center;padding:20px}
.screen h1{font-size:56px;margin:0 0 6px;letter-spacing:6px;background:linear-gradient(90deg,#ffd166,#ef476f,#8ecae6);-webkit-background-clip:text;background-clip:text;color:transparent}
.screen p{opacity:.85;max-width:680px;line-height:1.7}
.btns{display:flex;gap:18px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.big{font:inherit;font-size:19px;padding:16px 26px;border-radius:14px;border:2px solid #ffd166;background:rgba(255,209,102,.12);color:#fff;cursor:pointer;min-width:250px}
.big small{display:block;font-size:13px;opacity:.75;margin-top:4px}
.big:hover{background:rgba(255,209,102,.3)}
.opt{margin-top:14px;font-size:14px;opacity:.9}
#mg{position:fixed;left:50%;top:10px;transform:translateX(-50%);background:rgba(8,10,24,.95);border:2px solid #8ecae6;border-radius:16px;padding:16px 20px;width:min(720px,94vw);z-index:10;text-align:center}
#mg h2{margin:0 0 6px;color:#ffd166}
#mg canvas{background:#0d1330;border-radius:10px;width:100%;max-width:660px;max-height:36vh;object-fit:contain}
#mg .info{margin:8px 0;font-size:16px;min-height:24px}
#mg .mgb{display:flex;gap:14px;justify-content:center;margin-top:8px}
#mg .mgb button{font:inherit;font-size:20px;padding:10px 28px;border-radius:12px;border:none;cursor:pointer;color:#fff;transition:opacity .2s}
.up{background:#d62839}.down{background:#2a9d8f}.neu{background:#457b9d}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(255,209,102,.95);color:#222;font-weight:800;padding:10px 22px;border-radius:14px;font-size:20px;pointer-events:none;transition:opacity .5s}
#ending{z-index:30;background:radial-gradient(circle at 50% 40%,#ff9f68 0%,#6a2c70 45%,#120c26 85%)}
#ending .stat{font-size:28px;margin:6px}
#ending .legend{font-size:30px;margin-top:22px;font-weight:800;color:#fff3b0;text-shadow:0 0 18px #ffb703}
#ending .verdict{margin-top:14px;font-size:16px;background:rgba(0,0,0,.3);padding:10px 18px;border-radius:12px;max-width:640px}

/* ===================== 觸控／手機版 ===================== */
.touchonly{display:none!important}
#tc,#rotatehint,#tbar{display:none}
body.touch{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;overscroll-behavior:none;position:fixed;inset:0;width:100%}
body.touch *{touch-action:manipulation}
body.touch #c,body.touch #tc,body.touch #tc *{touch-action:none}
body.touch .touchonly{display:flex!important}
body.touch #lockhint{display:none!important}
body.touch #hud{left:calc(8px + env(safe-area-inset-left));top:calc(6px + env(safe-area-inset-top));min-width:0;max-width:44vw;padding:6px 9px;font-size:11.5px;line-height:1.45;border-radius:10px;pointer-events:auto;cursor:pointer}
body.touch #hud .ch{font-size:13px;margin-bottom:2px}
body.touch #hud .row b{width:46px}
body.touch #hud .obj{font-size:11px;margin-top:3px;padding-top:3px}
body.touch #hud .cam{font-size:10px;margin-top:3px}
body.touch #hud.collapsed .row,body.touch #hud.collapsed .cam{display:none}
body.touch #hud.collapsed .obj div.done{display:none}
body.touch #mini{width:104px;height:104px;right:calc(8px + env(safe-area-inset-right));top:calc(6px + env(safe-area-inset-top))}
body.touch #help{left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:max-content;max-width:min(440px,calc(100vw - 400px));font-size:12px;line-height:1.5;text-align:center;transition:opacity .6s}
body.touch.isbusy #help{opacity:0!important}
body.touch #prompt{font-size:14px;bottom:auto;top:58%}
body.touch #toast{font-size:15px;padding:7px 14px;top:14%}
body.touch #dlg{width:min(760px,calc(100vw - 16px - env(safe-area-inset-left) - env(safe-area-inset-right)));bottom:calc(8px + env(safe-area-inset-bottom));padding:9px 14px 12px;border-radius:12px;cursor:pointer;max-height:calc(100% - 16px);overflow-y:auto;z-index:12}
body.touch #dlg .who{font-size:13px;margin-bottom:4px;padding:1px 10px}
body.touch #dlg .txt{font-size:16px;line-height:1.5;min-height:46px}
body.touch #dlg .next{font-size:11px;right:12px;bottom:4px}
body.touch #choices{gap:7px;margin-top:6px}
body.touch #choices button{font-size:16px;min-height:48px;padding:10px 14px;border-radius:12px;background:rgba(255,209,102,.16);border-color:rgba(255,209,102,.6)}
body.touch #choices button:active{background:rgba(255,209,102,.45)}
body.touch #phone{right:calc(10px + env(safe-area-inset-right));top:calc(120px + env(safe-area-inset-top));bottom:auto;transform:rotate(-6deg) scale(.55);transform-origin:top right;z-index:11}
body.touch #clock{right:calc(10px + env(safe-area-inset-right));top:calc(118px + env(safe-area-inset-top));bottom:auto;width:72px;height:72px;z-index:11}
body.touch #mg{top:calc(6px + env(safe-area-inset-top));padding:8px 10px;border-radius:12px;width:min(640px,calc(100vw - 12px));max-height:calc(100% - 12px);overflow-y:auto}
body.touch #mg h2{font-size:16px;margin:0 0 4px}
body.touch #mg .info{font-size:13px;margin:4px 0;min-height:0}
body.touch #mg canvas{max-height:24vh}
body.touch #mg .mgb button{font-size:18px;padding:12px 26px;min-height:52px;flex:1;max-width:200px}
body.touch #mg .mgb button:active{filter:brightness(1.4)}
body.touch .screen{justify-content:safe center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
body.touch .screen *{touch-action:pan-y}
body.touch .screen h1{font-size:clamp(28px,8vw,46px);letter-spacing:3px}
body.touch .screen p{font-size:14px;margin:6px 0;line-height:1.55}
body.touch .big{font-size:16px;padding:12px 16px;min-width:0;width:min(320px,86vw)}
body.touch .btns{gap:10px;margin-top:10px}
body.touch .opt{font-size:14px;margin-top:10px}
body.touch .opt input{width:20px;height:20px;vertical-align:middle}
body.touch #ending .stat{font-size:20px}
body.touch #ending .legend{font-size:20px;margin-top:12px}
body.touch #ending .verdict{font-size:14px}
/* 觸控控制層 */
body.touch.playing #tc{display:block}
body.touch.isbusy #tc{display:none!important}
#tc{position:fixed;inset:0;pointer-events:none;z-index:9}
#joy{position:fixed;left:calc(28px + env(safe-area-inset-left));bottom:calc(28px + env(safe-area-inset-bottom));width:124px;height:124px;margin:0;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.35);opacity:.55;transition:opacity .2s}
#joy.active{opacity:.95;transition:none}
#joy .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 2px 10px rgba(0,0,0,.4)}
#joy.run .knob{background:#ffd166}
#joy .lbl{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-size:11px;opacity:.8}
.tbtn{position:fixed;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(10,14,30,.55);color:#fff;font:inherit;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;-webkit-user-select:none;user-select:none}
.tbtn.on,.tbtn:active{background:rgba(255,209,102,.55);border-color:#ffd166}
#tAct{right:calc(26px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:78px;height:78px;font-size:19px}
#tAct.near{background:rgba(255,209,102,.7);border-color:#ffd166;color:#222;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,209,102,.25)}}
#tJump{right:calc(118px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;font-size:17px}
#tbar{position:fixed;right:calc(8px + env(safe-area-inset-right));top:calc(116px + env(safe-area-inset-top));gap:6px;flex-direction:column;z-index:9}
body.touch.playing #tbar{display:flex}
#tbar .tbtn{position:static;width:42px;height:42px;font-size:13px;border-radius:12px}
#tbar .tbtn.off{opacity:.45}
#rotatehint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;background:rgba(255,209,102,.96);color:#222;font-weight:700;padding:8px 10px 8px 14px;border-radius:14px;font-size:14px;align-items:center;gap:10px;width:max-content;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#rotatehint button{font:inherit;border:none;background:#222;color:#fff;border-radius:50%;width:32px;height:32px;flex:none}
@media (orientation:portrait){
  body.touch:not(.rotdismissed) #rotatehint{display:flex}
  body.touch.playing #mini{display:none}
  body.touch.playing #tbar{top:calc(8px + env(safe-area-inset-top))}
  body.touch.playing:not(.rotdismissed) #rotatehint{bottom:auto;top:40%}
  body.touch.playing.isbusy #rotatehint,body.touch.playing.mgopen #rotatehint{display:none}
  body.touch #help{bottom:calc(190px + env(safe-area-inset-bottom));max-width:92vw}
  body.touch #hud{max-width:58vw}
  body.touch #mg canvas{max-height:22vh}
  body.touch #phone{top:calc(64px + env(safe-area-inset-top))}
  body.touch #clock{top:calc(64px + env(safe-area-inset-top))}
}
/* 橫向矮螢幕：小遊戲面板放左邊、對話框放右邊，避免重疊 */
@media (orientation:landscape) and (max-height:560px){
  body.touch.mgopen #mg{left:calc(6px + env(safe-area-inset-left));transform:none;width:calc(50vw - 10px);top:6px}
  body.touch.mgopen #mg canvas{max-height:46vh}
  body.touch.mgopen #dlg{left:auto;right:calc(6px + env(safe-area-inset-right));transform:none;width:calc(50vw - 10px - env(safe-area-inset-right))}
  body.touch #phone{top:calc(4px + env(safe-area-inset-top));right:calc(120px + env(safe-area-inset-right));transform:rotate(-6deg) scale(.36)}
  body.touch #clock{top:calc(6px + env(safe-area-inset-top));right:calc(120px + env(safe-area-inset-right));width:64px;height:64px}
  body.touch #dlg .txt{font-size:15px;min-height:40px}
  body.touch #choices button{min-height:44px;padding:8px 12px;font-size:15px}
  body.touch #hud .obj{max-height:30vh;overflow:hidden}
  body.touch .screen h1{font-size:30px}
  body.touch .screen p{font-size:13px;margin:4px 0}
  body.touch .btns{flex-wrap:nowrap}
  body.touch #ending .stat{font-size:16px;margin:2px}
  body.touch #ending .legend{font-size:17px;margin-top:6px}
  body.touch #ending .verdict{margin-top:8px;padding:6px 12px}
  body.touch .big{width:auto;flex:1;max-width:340px;padding:10px 14px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hud" class="hidden"></div>
<canvas id="mini" width="170" height="170" class="hidden"></canvas>
<div id="help" class="hidden"></div>
<div id="cross" class="hidden"></div>
<div id="lockhint" class="hidden">點擊畫面鎖定滑鼠視角（Esc 解除；也可按住滑鼠拖曳）</div>
<div id="prompt" class="hidden"></div>
<div id="toast" style="opacity:0"></div>
<div id="dlg" class="hidden"><div class="who"></div><div class="txt"></div><div id="choices"></div><div class="next">E / 空白鍵 / 點擊 繼續 ▶</div></div>
<div id="phone" class="hidden"><div class="n">📱 交易所 App</div><div class="t">5</div><div class="s">委託即將逾時…</div></div>
<canvas id="clock" width="110" height="110" class="hidden"></canvas>
<div id="mg" class="hidden"></div>
<div id="fade"></div>
<div id="tc">
  <div id="joy" class="hideBusy"><div class="knob"></div><div class="lbl">移動・推到底跑</div></div>
  <button class="tbtn hideBusy" id="tJump" type="button">跳</button>
  <button class="tbtn" id="tAct" type="button">互動</button>
</div>
<div id="tbar"><button class="tbtn" id="tCam" type="button">視角</button><button class="tbtn" id="tVoice" type="button">🔊</button><button class="tbtn" id="tBgm" type="button">🎵</button></div>
<div id="rotatehint"><span>📱↻ 建議將手機橫放，遊玩體驗更好</span><button type="button" id="rotx" aria-label="關閉">✕</button></div>

<div id="start" class="screen">
  <h1>阿葛人生模擬器</h1>
  <p>從靠窗發呆的國小生，到手握比特幣與以太幣的傳奇。<br>選擇你要用誰的眼睛，走過阿葛的人生。</p>
  <div class="btns">
    <button class="big" id="bA">👁 第一視角<small>戰役 A：阿葛的內心獨白（第一人稱鏡頭）</small></button>
    <button class="big" id="bB">🎥 第三視角<small>戰役 B：「我」的回憶旁白（第三人稱鏡頭）</small></button>
  </div>
  <div class="opt"><label><input type="checkbox" id="hard"> 重來一次模式（決策時間更短，越關鍵越緊）</label><span id="hardlock"></span></div>
  <div class="opt"><label><input type="checkbox" id="voiceOn" checked> 配音</label> &nbsp; <label><input type="checkbox" id="bgmOn" checked> 配樂</label></div>
  <p id="vhint" style="font-size:13px;opacity:.6">按 V 可隨時切換第一／第三人稱鏡頭。本作為純虛構遊戲，與任何真實交易無關，不構成投資建議。</p>
  <p id="loadmsg" style="font-size:13px;opacity:.6"></p>
</div>

<div id="ending" class="screen hidden"></div>
<script src="three.min.js"></script>
<script>
// ===== 台詞資料：L(id, 說話者, 情緒, 文字) =====
const LINES = {};
function L(id, who, emo, text){ LINES[id] = {who, emo, text}; }
// ---- 第一章 國小 ----
L('b1_01','nar','calm','阿葛是我的國小同學。上課的時候，他總是坐在靠窗的位子，盯著窗外發呆。');
L('b1_02','nar','calm','老師在講台上講什麼，他好像都沒在聽。可是他的眼睛……一直在看著什麼。');
L('a1_01','think_k','whisper','窗外的雲……一直在動。往左，又往右。');
L('a1_02','think_k','whisper','它們好像……有一種規律。');
L('c1_t1','teacher','calm','阿葛！你又在看窗外了？');
L('c1_t2','age_k','calm','老師……雲，也會漲，也會跌耶。');
L('c1_t3','teacher','disbelief','……你下課，來辦公室一趟。');
L('b1_w1','nar','calm','他就這樣看著窗外，一看，就是一整節課。');
L('a1_w1','think_k','whisper','如果我能知道……下一朵雲，會飄去哪裡就好了。');
L('c1_h1','me_k','excited','阿葛，來我家玩！我家有電腦喔！');
L('c1_h2','age_k','disbelief','這是什麼？');
L('c1_h3','me_k','calm','我爸在看股票啦。');
L('c1_h4','age_k','disbelief','紅色跟綠色的數字……一直在跳。');
L('c1_h5','me_k','calm','紅的是漲，綠的是跌。我爸說的。');
L('b1_h1','nar','calm','那天，阿葛在我家的電腦前面，站了很久很久。我從來沒看過他，那麼專心。');
L('a1_h1','think_k','whisper','跟窗外的雲……一模一樣。有人在猜，它下一步，往哪裡走。');
L('c1_u1','uncle','excited','小朋友，來來來，陪阿伯玩個遊戲！');
L('c1_u2','uncle','calm','這張圖，是阿伯每天記的糖果批發價。你猜猜看，明天，是漲，還是跌？');
L('c1_u3','uncle','excited','猜對了，糖果就送你！');
L('c1_u4','uncle','disbelief','哇……你這個孩子，是天生的吧？');

// ===== 主程式 =====
function main(THREE){
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const S = { camp:'B', cam:'tps', hard:false, voice:true, bgm:true, chapter:0, candy:0, cash:0, btc:0, eth:0,
  decisions:[], busy:false, started:false, trades:{win:0,lose:0}, flags:{} };
window.__game = S;
// ---------- 觸控裝置偵測（手機／平板） ----------
const mq = q => { try{ return matchMedia(q).matches; }catch(e){ return false; } };
let IS_TOUCH = !Q.has('notouch') && (Q.has('touch') || mq('(pointer: coarse)') || (navigator.maxTouchPoints>0 && mq('(hover: none)')));
if(IS_TOUCH) document.body.classList.add('touch');
S.touch = IS_TOUCH;
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const rand = (a,b)=>a+Math.random()*(b-a);
const fmt = n => Math.round(n).toLocaleString('zh-TW');

// ---------- 音訊：自適應配樂 + 音效 ----------
let AC=null, master, musicBus, sfxBus, layers={}, curMood=null;
const MOODS = {
  calm:{bpm:84, prog:[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,65]], lead:'triangle', arp:[0,1,2,3,2,1,0,2], drone:false},
  tense:{bpm:124, prog:[[45,48,52,53],[45,48,51,53],[44,48,51,52],[45,48,52,55]], lead:'sawtooth', arp:[0,0,1,0,0,2,0,3], drone:true},
  triumph:{bpm:128, prog:[[60,64,67,72],[55,59,62,67],[57,60,64,69],[53,57,60,65]], lead:'square', arp:[0,1,2,3,2,3,1,2], drone:false, kick:true},
  emotional:{bpm:64, prog:[[53,57,60,64],[55,59,62,67],[52,55,59,64],[57,60,64,69]], lead:'sine', arp:[0,2,1,3,2,1,3,2], drone:false},
};
const mtof = m => 440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(AC) return; try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
  musicBus = AC.createGain(); musicBus.gain.value = S.bgm? .32 : 0; musicBus.connect(master);
  sfxBus = AC.createGain(); sfxBus.gain.value = .7; sfxBus.connect(master);
  for(const k in MOODS){ const g = AC.createGain(); g.gain.value = 0; g.connect(musicBus); layers[k] = {g, next:AC.currentTime+.1, step:0}; }
  setInterval(schedule, 50);
}
function note(dest, type, f, t, dur, vol, cutoff){
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f;
  let node = o;
  if(cutoff){ const fl = AC.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=cutoff; o.connect(fl); node = fl; }
  node.connect(g); g.connect(dest);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+.05);
}
function schedule(){
  for(const k in layers){ const L = layers[k], M = MOODS[k];
    if(L.g.gain.value < 0.003 && k!==curMood){ L.next = AC.currentTime+.05; continue; }
    const sp = 60/M.bpm/2; // 8分音符
    while(L.next < AC.currentTime+.25){
      const bar = Math.floor(L.step/8)%4, chord = M.prog[bar], s = L.step%8, t = L.next;
      const nn = chord[M.arp[s]] + 12;
      note(L.g, M.lead, mtof(nn), t, sp*1.6, k==='tense'?.05:.08, k==='tense'?1400:3000);
      if(s===0){ chord.forEach(c=>note(L.g, k==='emotional'?'sine':'triangle', mtof(c), t, sp*8, .05, 1200)); note(L.g,'sine',mtof(chord[0]-12),t,sp*8,.12); }
      if(M.drone && s%2===0) note(L.g,'sawtooth',mtof(33),t,sp*1.2,.07,300);
      if(k==='tense' && s===6) note(L.g,'square',mtof(chord[0]+13),t,sp,.03,900);
      if(M.kick && s%2===0){ const o=AC.createOscillator(),g=AC.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+.15); g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+.2); o.connect(g); g.connect(L.g); o.start(t); o.stop(t+.25); }
      L.next += sp; L.step++;
    }
  }
}
function setMood(m, fade=2.0){
  if(!AC || m===curMood) return; curMood = m; const t = AC.currentTime;
  for(const k in layers){ const g = layers[k].g.gain; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(k===m?1:0, t+fade); }
}
function sfx(kind){
  if(!AC) return; const t = AC.currentTime;
  if(kind==='tick'){ const b=AC.createBuffer(1,800,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<800;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/80); const s=AC.createBufferSource(); s.buffer=b; const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=2500; s.connect(f); f.connect(sfxBus); s.start(t); }
  if(kind==='heart'){ [0,.18].forEach((dt,i)=>{ const o=AC.createOscillator(),g=AC.createGain(); o.frequency.setValueAtTime(i?55:65,t+dt); o.frequency.exponentialRampToValueAtTime(35,t+dt+.15); g.gain.setValueAtTime(.0001,t+dt); g.gain.exponentialRampToValueAtTime(i?.5:.7,t+dt+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dt+.22); o.connect(g); g.connect(sfxBus); o.start(t+dt); o.stop(t+dt+.3); }); }
  if(kind==='coin'){ note(sfxBus,'square',988,t,.08,.12); note(sfxBus,'square',1319,t+.08,.25,.12); }
  if(kind==='good'){ [72,76,79,84].forEach((n,i)=>note(sfxBus,'triangle',mtof(n),t+i*.08,.3,.15)); }
  if(kind==='bad'){ [64,60,55].forEach((n,i)=>note(sfxBus,'sawtooth',mtof(n),t+i*.12,.3,.08,1500)); }
  if(kind==='portal'){ for(let i=0;i<8;i++) note(sfxBus,'sine',mtof(60+i*3),t+i*.05,.4,.08); }
  if(kind==='step'){ note(sfxBus,'sine',90+Math.random()*30,t,.06,.05,400); }
  if(kind==='stir'){ note(sfxBus,'triangle',300+Math.random()*80,t,.05,.03,800); }
}
// 配音
let voiceEl = null, voiceTok = 0;
// iOS：同一個 <audio> 元素在第一次觸控時「解鎖」後重複使用，之後換 src 播放才不會被擋
const voicePlayer = new Audio(); voicePlayer.preload = 'auto';
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
function playVoice(id){
  stopVoice(); if(!S.voice || !LINES[id] || LINES[id].who==='sys') return Promise.resolve();
  const tok = ++voiceTok;
  return new Promise(res=>{ const a = voicePlayer; voiceEl = a; a.muted = false; a.volume = 1; a.src = 'voice/'+id+'.mp3';
    if(AC && musicBus) { musicBus.gain.setTargetAtTime((S.bgm?.32:0)*.45, AC.currentTime, .2); }
    const done=()=>{ if(tok!==voiceTok) return; if(AC&&musicBus) musicBus.gain.setTargetAtTime(S.bgm?.32:0, AC.currentTime, .4); res(); };
    a.onended = done; a.onerror = done; const p=a.play(); if(p&&p.catch) p.catch(done); });
}
function stopVoice(){ if(voiceEl){ voiceTok++; voiceEl.onended=null; voiceEl.onerror=null; voiceEl.pause(); voiceEl=null; } }
// 第一次觸控／點擊：恢復 AudioContext、播放無聲緩衝、預熱 HTMLAudio（iOS Safari 需要）
let audioUnlocked = false;
function unlockAudio(){
  initAudio();
  if(AC){ if(AC.state!=='running' && AC.resume) AC.resume().catch(()=>{});
    if(!audioUnlocked){ try{ const b=AC.createBuffer(1,1,22050), src=AC.createBufferSource(); src.buffer=b; src.connect(AC.destination); src.start(0); }catch(e){} } }
  if(!audioUnlocked){ audioUnlocked = true;
    if(!voiceEl){ try{ voicePlayer.muted = true; voicePlayer.src = SILENT_WAV; const p=voicePlayer.play(); const fin=()=>{ voicePlayer.muted=false; }; if(p&&p.then) p.then(()=>{ if(!voiceEl) voicePlayer.pause(); fin(); }, fin); else fin(); }catch(e){} } }
}
['touchend','pointerup','click','keydown'].forEach(ev=>addEventListener(ev, unlockAudio, {capture:true, passive:true}));

// ---------- 渲染器 / 場景 ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:!IS_TOUCH || devicePixelRatio<2, powerPreference:'high-performance'});
// 手機：限制 devicePixelRatio ≤ 1.5、陰影改用較便宜的 PCF 與較小的貼圖
const maxDPR = () => IS_TOUCH ? 1.5 : 2;
renderer.setPixelRatio(Math.min(devicePixelRatio,maxDPR())); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = IS_TOUCH ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, .05, 400);
function fitCamFov(){ const asp=innerWidth/innerHeight; camera.aspect=asp;
  // 手機直向：加大垂直 FOV，讓水平視野不會太窄
  camera.fov = (IS_TOUCH && asp<1) ? Math.min(95, 2*Math.atan(Math.tan(35*Math.PI/180)/Math.max(asp,.4)*.62)*180/Math.PI) : 70;
  camera.fov = Math.max(70, camera.fov); camera.updateProjectionMatrix(); }
function onResize(){ fitCamFov(); renderer.setPixelRatio(Math.min(devicePixelRatio,maxDPR())); renderer.setSize(innerWidth,innerHeight); }
addEventListener('resize', onResize);
addEventListener('orientationchange', ()=>{ setTimeout(onResize,250); setTimeout(onResize,700); });
if(window.visualViewport) visualViewport.addEventListener('resize', ()=>{ if(Math.abs(innerWidth-canvas.clientWidth)>1||Math.abs(innerHeight-canvas.clientHeight)>1) onResize(); });
fitCamFov();
let scene, colliders=[], interacts=[], npcs=[], portal=null, animated=[], screens=[];

function skyTex(top, bot){ const c=document.createElement('canvas'); c.width=2; c.height=256; const g=c.getContext('2d'); const gr=g.createLinearGradient(0,0,0,256); gr.addColorStop(0,top); gr.addColorStop(1,bot); g.fillStyle=gr; g.fillRect(0,0,2,256); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
function labelSprite(text, color='#fff', bg='rgba(0,0,0,.55)', scale=1){
  const c=document.createElement('canvas'), g=c.getContext('2d'); g.font='bold 44px sans-serif'; const w=Math.ceil(g.measureText(text).width)+40; c.width=w; c.height=70;
  g.font='bold 44px sans-serif'; g.fillStyle=bg; g.beginPath(); g.roundRect(0,0,w,70,20); g.fill(); g.fillStyle=color; g.textBaseline='middle'; g.fillText(text,20,37);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));
  s.scale.set(w/70*.45*scale,.45*scale,1); s.renderOrder=10; return s;
}
const MAT = {}; function mat(c, o={}){ const k=c+JSON.stringify(o); return MAT[k]||(MAT[k]=new THREE.MeshStandardMaterial({color:c, roughness:.8, ...o})); }
function box(w,h,d,color,x,y,z,parent,opts={}){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), opts.material||mat(color,opts.m||{})); m.position.set(x,y,z); m.castShadow=opts.cast!==false; m.receiveShadow=true; (parent||scene).add(m); if(opts.collide) colliders.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,h:y+h/2}); return m; }

// 房間：前方(+z)留門
function room(cx,cz,w,d,wallC,floorC,label,opts={}){

function moveCollide(p, nx, nz){

  for(const c of colliders){ if(p.y > c.h) continue;
    if(x>c.x0-r && x<c.x1+r && z>c.z0-r && z<c.z1+r){
      const ox = Math.min(x-(c.x0-r), (c.x1+r)-x), oz = Math.min(z-(c.z0-r), (c.z1+r)-z);
      if(ox<oz){ x = (x-(c.x0-r) < (c.x1+r)-x) ? c.x0-r : c.x1+r; } else { z = (z-(c.z0-r) < (c.z1+r)-z) ? c.z0-r : c.z1+r; }
    } }

}

  if(keys.Space && player.onGround && !S.busy){ player.vel.y=6.2; player.onGround=false; }

// ---- 決策（帶臨場計時） ----
// opts: {prompt:lineId|text, options:[{t,calm}], time:秒或0, def:index, stakes:'calm'|'important'|'crash', key}
let choiceResolve=null;
function decide(o){
  return new Promise(res=>{
    const d=$('dlg'); d.classList.remove('hidden'); d.querySelector('.next').style.display='none';
    const w=d.querySelector('.who'), tx=d.querySelector('.txt');
    w.textContent='抉擇'; w.className='who'; tx.className='txt'; tx.textContent=o.prompt;
    const box=$('choices'); box.innerHTML='';
    let T = o.time||0; if(T && S.hard) T = Math.max(2.5, T * (o.stakes==='crash'?.55:o.stakes==='important'?.65:.8));
    const prevMood=curMood; if(o.stakes==='crash'||o.stakes==='important') setMood('tense',1);
    const btns=o.options.map((op,i)=>{ const b=document.createElement('button'); b.textContent=(i+1)+'. '+op.t; b.onclick=e=>{ if(e) e.stopPropagation(); finish(i,false); }; box.appendChild(b); return b; });
    let left=T, timer=null, beat=null, done=false;
    const phone=$('phone'), clock=$('clock'), vig=$('vig');
    function finish(i,timeout){ if(done) return; done=true; clearInterval(timer); clearInterval(beat); phone.classList.add('hidden'); clock.classList.add('hidden'); vig.style.boxShadow=''; vig.style.animation='';
      choiceResolve=null; btns.forEach(b=>b.style.opacity=1); const op=o.options[i];
      S.decisions.push({key:o.key, calm:!!op.calm && !timeout, timeout, stakes:o.stakes});
      if(timeout) toast('⏰ 時間到……'+op.t, 2200);
      if(o.stakes!=='calm' && prevMood) setMood(prevMood,1.5);
      res({i,timeout}); }
    choiceResolve=i=>{ if(i<o.options.length) finish(i,false); };
    if(T>0){
      if(o.stakes==='crash'){ phone.classList.remove('hidden'); phone.querySelector('.t').textContent=Math.ceil(left); }
      else { clock.classList.remove('hidden'); }
      const t0=performance.now();
      timer=setInterval(()=>{ const el=(performance.now()-t0)/1000; left=T-el;
        const frac=Math.max(0,left/T);
        btns.forEach((b,i)=>{ b.style.opacity = i===o.def ? 1 : (.25+.75*frac); });
        if(o.stakes==='crash'){ phone.querySelector('.t').textContent=Math.max(0,Math.ceil(left)); vig.style.boxShadow=`inset 0 0 ${160+Math.sin(el*8)*40}px ${40+(1-frac)*60}px rgba(200,0,0,${.25+(1-frac)*.4})`; }
        else drawClock(frac);
        if(left<=0) finish(o.def,true); }, 50);
      let lastTick=-1; const tk=setInterval(()=>{ if(done){ clearInterval(tk); return; } sfx('tick'); }, o.stakes==='crash'?500:1000);
      if(o.stakes!=='calm'){ beat=setInterval(()=>sfx('heart'), o.stakes==='crash'?600:900); sfx('heart'); }
    }
  });
}
function drawClock(frac){ const c=$('clock'), g=c.getContext('2d'); g.clearRect(0,0,110,110); g.fillStyle='#fdf6e3'; g.strokeStyle='#5c4033'; g.lineWidth=6; g.beginPath(); g.arc(55,55,48,0,7); g.fill(); g.stroke();
  g.fillStyle='rgba(239,71,111,.35)'; g.beginPath(); g.moveTo(55,55); g.arc(55,55,44,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-frac)); g.fill();
  for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; g.fillStyle='#5c4033'; g.fillRect(55+Math.sin(a)*38-2,55-Math.cos(a)*38-2,4,4); }
  const a=-Math.PI/2+Math.PI*2*(1-frac); g.strokeStyle='#222'; g.lineWidth=3; g.beginPath(); g.moveTo(55,55); g.lineTo(55+Math.cos(a)*36,55+Math.sin(a)*36); g.stroke(); }

function onKey(e){
  if(!S.started) return;
  if(e.code==='KeyV'){ setCam(S.cam==='fps'?'tps':'fps'); toast(S.cam==='fps'?'第一人稱':'第三人稱',900); }
  if(e.code==='KeyH') $('help').classList.toggle('hidden');
  if(e.code==='KeyM'){ S.voice=!S.voice; if(!S.voice) stopVoice(); toast('配音：'+(S.voice?'開':'關'),900); }
  if(e.code==='KeyB'){ S.bgm=!S.bgm; if(musicBus) musicBus.gain.setTargetAtTime(S.bgm?.32:0,AC.currentTime,.3); toast('配樂：'+(S.bgm?'開':'關'),900); }
  if(choiceResolve && /^Digit[1-4]$/.test(e.code)){ choiceResolve(+e.code.slice(5)-1); return; }
  if((e.code==='KeyE'||e.code==='Space'||e.code==='Enter') && advance){ e.preventDefault(); advance(); return; }
  if(e.code==='KeyE' && !S.busy && nearest) runInteract(nearest);
}

function drawLine(cv,data,opts={}){ const g=cv.getContext('2d'), W=cv.width, H=cv.height; g.clearRect(0,0,W,H); const mn=Math.min(...data), mx=Math.max(...data), pad=20;
  g.strokeStyle='rgba(255,255,255,.08)'; for(let i=0;i<5;i++){ g.beginPath(); g.moveTo(0,pad+i*(H-2*pad)/4); g.lineTo(W,pad+i*(H-2*pad)/4); g.stroke(); }
  const X=i=>pad+i/(data.length-1+(opts.extra||0))*(W-2*pad), Y=v=>H-pad-(v-mn)/(mx-mn+1e-9)*(H-2*pad);
  if(opts.candle){ for(let i=1;i<data.length;i++){ const up=data[i]>=data[i-1]; g.fillStyle=up?'#ff4d6d':'#2ee59d'; const w=(W-2*pad)/data.length*.7; g.fillRect(X(i)-w/2,Math.min(Y(data[i]),Y(data[i-1])),w,Math.max(2,Math.abs(Y(data[i])-Y(data[i-1])))); } }
  else { g.lineWidth=3; for(let i=1;i<data.length;i++){ g.strokeStyle=data[i]>=data[i-1]?'#ff4d6d':'#2ee59d'; g.beginPath(); g.moveTo(X(i-1),Y(data[i-1])); g.lineTo(X(i),Y(data[i])); g.stroke(); } }
  g.fillStyle='#fff'; g.font='14px sans-serif'; g.fillText((opts.unit||'')+data[data.length-1].toFixed(opts.dp??1),W-90,16);
}
// 趨勢：下一步方向與近期動能相關（看得懂圖的人勝率較高）
function trendSeries(n,start,vol,bias){ const a=[start]; let drift=(Math.random()-.5)*vol*.8; for(let i=1;i<n;i++){ if(Math.random()<.08) drift=(Math.random()-.5)*vol*.8; a.push(a[i-1]*(1+drift+(Math.random()-.5)*vol)); } const mom=a[n-1]-a[n-6]; const up = Math.random()<bias ? mom>0 : mom<=0; return {a,up}; }

function loop(){

  for(const n of npcs){ n.body.position.y=Math.sin(t*2+n.g.position.x)*.02; n.la.rotation.x=Math.sin(t*1.5+n.g.position.z)*.08; }

  for(const it of interacts){ if(it.disabled) continue; const [x,y]=P(it.x,it.z); g.fillStyle=it.npc?'#ffd166':'#8ecae6'; g.beginPath(); g.arc(x,y,4,0,7); g.fill(); }
