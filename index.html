<script>

const CFG=Object.assign({speed:2,mute:false,stats:window.innerWidth>700},LS.get('cfg',{}));

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='square',v=.06,t0=0,slide=0){if(CFG.mute)return;const a=ac();if(!a)return;const t=a.currentTime+t0;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v=.15,t0=0){if(CFG.mute)return;const a=ac();if(!a)return;const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(a.destination);s.start(a.currentTime+t0)}
const SFX={

 click:()=>tone(660,.06,'triangle',.08),

 good:()=>{tone(659,.1,'square',.06);tone(880,.12,'square',.06,.08);tone(1046,.16,'square',.06,.16)},
 bad:()=>{tone(300,.25,'sawtooth',.06,0,-150)},
 door:()=>{tone(110,.15,'square',.12);noise(.12,.2,.02);tone(90,.2,'square',.1,.15)},
 whistle:()=>{tone(2200,.12,'sine',.12);tone(2200,.35,'sine',.12,.18)},
 sob:()=>{tone(440,.4,'sine',.05,0,-120);tone(392,.5,'sine',.05,.45,-100)},
 hit:()=>{noise(.35,.4);tone(80,.3,'square',.15,0,-40)},

const P={};
function compile(name,steps){const out=[];P[name]=out;
 const sub=arr=>{for(const s of arr){
  if(s[0]==='?'){const k=out.length;out.push({op:'unless',fn:s[1],to:0});sub(s[2]);if(s[3]){const j=out.length;out.push({op:'jmp',to:0});out[k].to=out.length;sub(s[3]);out[j].to=out.length}else out[k].to=out.length}
  else if(s[0]==='ch'||s[0]==='tch'){const k=out.length;s[2].forEach((o,oi)=>{if(o.r){const bn=name+'#'+k+'_'+oi;o.rb=bn;compile(bn,[...o.r,['ret',name,k+1]])}});out.push(s)}
  else out.push(s)}};
 sub(steps)}
for(const k in RAW)compile(k,RAW[k]);

 const C=CH[c];if(!C||!C.f)return;const prev=ST.show;e=e||(prev&&prev.c===c?prev.e:'n');ST.show={c,e};
 p.classList.remove('hidden');p.querySelector('.ring').style.setProperty('--c',C.c);p.querySelector('.face').textContent=C.f[e]||C.f.n;p.querySelector('.badge').textContent=C.b||'';
 const same=prev&&prev.c===c&&prev.e===e;p.className='';void p.offsetWidth;if(!same)p.classList.add('pop');if(e==='angry')p.classList.add('angry');if(e==='cry')p.classList.add('cry')}

/* ---------- engine ---------- */
function run(){
 for(let guard=0;guard<500;guard++){
  const blk=P[ST.b];if(!blk){console.error('no block '+ST.b);return}
  const s=blk[ST.i];if(!s){console.error('fell off '+ST.b+' @'+ST.i);return}
  if(s.op){ST.i=s.op==='unless'?(s.fn(ST.st,ST.f)?ST.i+1:s.to):s.to;continue}
  switch(s[0]){
   case 't':showText(s);return;
   case 'bg':setBg(s[1]);ST.i++;break;
   case 'show':setShow(s[1],s[2]);ST.i++;break;
   case 'hide':setShow(null);ST.i++;break;
   case 'mood':setMood(s[1]);ST.i++;break;
   case 'sfx':if(!skip)sfx(s[1]);ST.i++;break;
   case 'shake':{const a=$('#app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');ST.i++;break}
   case 'fx':applyFx(s[1]);ST.i++;break;
   case 'set':Object.assign(ST.f,s[1]);ST.i++;break;
   case 'go':ST.b=s[1];ST.i=0;break;
   case 'ret':ST.b=s[1];ST.i=s[2];break;
   case 'route':ST.b=s[1](ST.st,ST.f);ST.i=0;break;
   case 'title':chapterCard(s[1],s[2]);return;
   case 'ch':case 'tch':showChoice(s);return;
   case 'mini':startMini(s[1]);return;
   case 'end':showEnding(s[1]);return;
   default:console.error('bad op',s);ST.i++}
 }}

  R.forEach((r,k)=>{if(r.done)return;const acc=Math.min(1,.25+el/1.2);r.v=k===0?(6.3+bonus+boost)*acc:(sp[k]+Math.sin(el*3+k)*.3)*acc;r.x+=r.v*dt;r.d.style.left=(4+Math.min(100,r.x)*.9)+'%';if(r.x>=100){r.done=el;place.push(k)}});
  const TS=1.18;$('#st').textContent=((R[0].done||el)*TS).toFixed(2)+' 秒';
  if(R[0].done&&phase===1){phase=2;const rank=place.indexOf(0)+1;$('#sm').textContent=rank===1?`🥇 第一名！${(R[0].done*TS).toFixed(2)} 秒`:`第 ${rank} 名…… ${(R[0].done*TS).toFixed(2)} 秒`;sfx(rank===1?'win':'bad');later(()=>fin({rank,time:+(R[0].done*TS).toFixed(2),fs}),1500)}
  if(R.every(r=>r.done))return;miniRAF=requestAnimationFrame(loop)};
 $('#sg').onpointerdown=e=>{e.preventDefault();tap()};miniKey=e=>{if(['Space','ArrowLeft','ArrowRight','Enter','KeyA','KeyD'].includes(e.code)){e.preventDefault();if(!e.repeat)tap()}};window.addEventListener('keydown',miniKey);
 later(ready,300)}

 opts(){const s=P[ST.b][ST.i];return s&&(s[0]==='ch'||s[0]==='tch')?s[2].map(o=>({t:o.t,k:o.k||''})):[]}};
