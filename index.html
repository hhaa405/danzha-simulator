/* immersion */
#scene{animation:handheld 9s ease-in-out infinite}
@keyframes handheld{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-4px,2px) rotate(-.15deg)}50%{transform:translate(3px,-2px) rotate(.12deg)}75%{transform:translate(2px,3px) rotate(-.08deg)}}
body[data-mood=dark] #scene{filter:saturate(.55) brightness(.75) blur(.6px)}
body[data-mood=red] #scene{filter:saturate(1.3) contrast(1.15) hue-rotate(-12deg)}
body[data-mood=warm] #scene{filter:sepia(.25) saturate(1.2)}
body[data-mood=pink] #scene{filter:saturate(1.25) brightness(1.06)}
body[data-mood=blue] #scene{filter:saturate(.7) hue-rotate(15deg) brightness(.9)}
#scene{transition:opacity .5s,filter 1.2s}
body.anx #vign{animation:hbv 1.1s infinite;background:radial-gradient(ellipse at center,transparent 45%,rgba(120,0,20,.45))}
@keyframes hbv{0%,100%{opacity:.75}12%{opacity:1}24%{opacity:.8}36%{opacity:1}}
body.anx2 #scene{animation:jitter .18s infinite}
@keyframes jitter{0%{transform:translate(1px,-1px)}50%{transform:translate(-2px,1px)}100%{transform:translate(1px,1px)}}
body.slowmo #scene,body.slowmo #chars{transition:transform 2.4s cubic-bezier(.2,.8,.2,1),filter 2.4s!important;transform:scale(1.18) rotate(-2deg)!important;filter:grayscale(.7) contrast(1.3) blur(1px)!important;animation:none}
body.buzz #app,body.buzz #ping{animation:buzz .08s 5}
@keyframes buzz{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}100%{transform:none}}
#chars .cw.pov{transform-origin:50% 100%;animation:povin .5s ease-out}
@keyframes povin{from{transform:scale(.92) translateY(14px);opacity:.3}to{transform:none;opacity:1}}
#hud{transition:opacity .6s,transform .6s}
body.idle #hud{opacity:.12;transform:translateY(-6px)}body.idle #hud:hover{opacity:1;transform:none}
.whisper{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:30;pointer-events:none;color:#fff;font-style:italic;font-size:clamp(15px,2.4vw,22px);text-shadow:0 2px 12px rgba(0,0,0,.8);letter-spacing:2px;animation:whis 4.2s ease forwards;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@keyframes whis{0%{opacity:0;filter:blur(6px);transform:translate(-50%,8px)}15%,75%{opacity:.92;filter:blur(0);transform:translate(-50%,0)}100%{opacity:0;filter:blur(4px);transform:translate(-50%,-10px)}}
#ping.show{animation:slidein .45s cubic-bezier(.3,1.6,.5,1),pingwob .4s .45s 2}
@keyframes pingwob{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){#scene,body.anx2 #scene{animation:none}}
/* ===== v3 realistic layer ===== */
#sky{background-size:cover!important;background-position:center!important;transform-origin:50% 55%;animation:sway 22s ease-in-out infinite;transition:background 1s,filter .8s}
@keyframes sway{0%,100%{transform:scale(1.07) translate(0,0) rotate(0)}25%{transform:scale(1.08) translate(-.6%,.3%) rotate(-.15deg)}50%{transform:scale(1.075) translate(.4%,-.35%) rotate(.12deg)}75%{transform:scale(1.08) translate(.5%,.25%) rotate(-.08deg)}}
body.dof #sky{filter:blur(2.4px) brightness(.88)}
body.dof.narr #sky{filter:blur(1px) brightness(.8)}
#l1,#l2{display:none}
#grain{position:absolute;inset:0;background-size:220px 220px;z-index:6;pointer-events:none;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.4 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain .5s steps(4) infinite}
@keyframes grain{0%{background-position:0 0}25%{background-position:-60px 40px}50%{background-position:50px -70px}75%{background-position:-30px 80px}100%{background-position:70px 20px}}
html,body{overflow:hidden;overscroll-behavior:none}
#vign{background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5))!important}
#lbox{position:absolute;inset:0;pointer-events:none;z-index:7}
#lbox:before,#lbox:after{content:"";position:absolute;left:0;right:0;height:3.2vh;background:#000;z-index:7;pointer-events:none}
#lbox:before{top:0}#lbox:after{bottom:0}

 switch(e){

const P={};
function compile(name,steps){const out=[];P[name]=out;
 const sub=arr=>{for(const s of arr){
  if(s[0]==='?'){const k=out.length;out.push({op:'unless',fn:s[1],to:0});sub(s[2]);if(s[3]){const j=out.length;out.push({op:'jmp',to:0});out[k].to=out.length;sub(s[3]);out[j].to=out.length}else out[k].to=out.length}
  else if(s[0]==='ch'||s[0]==='tch'){const k=out.length;s[2].forEach((o,oi)=>{if(o.r){const bn=name+'#'+k+'_'+oi;o.rb=bn;compile(bn,[...o.r,['ret',name,k+1]])}});out.push(s)}
  else out.push(s)}};sub(steps)}
